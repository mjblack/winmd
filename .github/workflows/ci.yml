name: CI Testing

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  spec:
    name: spec (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install shards dependencies
        run: shards install --skip-postinstall

      - name: Fetch pinned WinMD fixture
        shell: pwsh
        run: ./scripts/fetch-winmd.ps1

      - name: Run specs
        run: crystal spec --error-trace

  generate:
    name: generate bindings from winmd (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install shards dependencies
        run: shards install --skip-postinstall

      - name: Fetch pinned WinMD fixture
        shell: pwsh
        run: ./scripts/fetch-winmd.ps1

      - name: Build winmd
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          crystal build src/cli.cr -o bin/winmd.exe
          if ($LASTEXITCODE -ne 0) { throw "crystal build failed" }

      # The generator reads the override files from the current directory.
      - name: Generate bindings
        shell: pwsh
        working-directory: examples/overrides
        run: ..\..\bin\winmd.exe generate --source-format winmd --dump-json ..\..\out\json ..\..\winmd\Windows.Win32.winmd ..\..\out

      - name: Compile representative namespaces
        shell: pwsh
        working-directory: out
        run: |
          $files = @(
            "src/win32cr/foundation.cr",
            "src/win32cr/system/threading.cr",
            "src/win32cr/system/com.cr",
            "src/win32cr/system/kernel.cr",
            "src/win32cr/storage/file_system.cr",
            "src/win32cr/ui/windows_and_messaging.cr",
            "src/win32cr/graphics/gdi.cr",
            "src/win32cr/graphics/direct2_d.cr",
            "src/win32cr/graphics/direct_composition.cr",
            "src/win32cr/security.cr",
            "src/win32cr/networking/win_sock.cr",
            "src/win32cr/media/audio.cr"
          )
          $failed = 0
          foreach ($file in $files) {
            Write-Host "== $file"
            crystal build --no-codegen $file
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { throw "$failed namespace file(s) failed to compile" }

      - name: Upload intermediate JSON
        uses: actions/upload-artifact@v4
        with:
          name: winmd-json
          path: out/json
          retention-days: 7
